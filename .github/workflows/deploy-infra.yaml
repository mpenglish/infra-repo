name: Publish Infrastructure Platform

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**'
      - 'istio/**'
      - 'metallb/**'
      - 'observability/**'
  workflow_dispatch:

jobs:
  publish-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ORAS CLI
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Generate Global Tag
        id: vars
        run: echo "SHA_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Package Manifests
        run: tar -czvf /tmp/infra-manifests.tar.gz .

      - name: Push OCI Artifact
        run: |

          echo "${{ secrets.DOCKER_PAT }}" | oras login registry-1.docker.io -u "markenglish156" --password-stdin
          
          # Push a specific versioned tag for audit history
          oras push registry-1.docker.io/markenglish156/infra-manifests:${{ env.SHA_TAG }} \
            /tmp/infra-manifests.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip --disable-path-validation
            
          # Push the 'latest' tag for Argo CD to poll
          oras push registry-1.docker.io/markenglish156/infra-manifests:latest \
            /tmp/infra-manifests.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip --disable-path-validation