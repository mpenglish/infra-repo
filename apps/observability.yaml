# apps/observability-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://registry-1.docker.io/markenglish156/infra-manifests
    targetRevision: latest
    path: observability # Points to the istio folder in the OCI artifact
    kustomize:
      enableHelm: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: kiali
      jsonPointers:
        - /data/config.yaml
    - group: apps
      kind: Deployment
      name: kiali
      jsonPointers:
        # Note: The ~1 is the required JSON Pointer escape sequence for a forward slash (/)
        - /spec/template/metadata/annotations/checksum~1config
        - /metadata/annotations/kiali.io~1dashboards
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true