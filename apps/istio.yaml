# apps/istio-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-istio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://registry-1.docker.io/markenglish156/infra-manifests
    targetRevision: latest
    path: istio # Points to the istio folder in the OCI artifact
    kustomize:
      enableHelm: true
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/failurePolicy
        - /webhooks/1/failurePolicy
    - group: apps
      kind: Deployment
      name: istiod
      jsonPointers:
        - /spec/template/spec/containers/0/env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true