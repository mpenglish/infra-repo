apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 62.3.1
    releaseName: prometheus
    valuesFile: prom-values.yaml
  - name: jaeger
    repo: https://jaegertracing.github.io/helm-charts
    version: 3.3.1
    releaseName: jaeger
    namespace: observability
    valuesInline:
      provisionDataStore:
        cassandra: false
      agent:
        enabled: false      # <--- Disables the duplicate service
      collector:
        enabled: false      # <--- Disables the standalone collector
      query:
        enabled: false
      allInOne:
        enabled: true # Uses in-memory storage (good for testing/local)
  - name: kiali-server
    repo: https://kiali.org/helm-charts
    version: 1.89.0
    releaseName: kiali
    namespace: observability
    valuesFile: kiali-values.yaml