prometheus:
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

grafana:
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'istio'
        orgId: 1
        folder: 'Istio'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/istio
  dashboards:
    istio:
      istio-mesh:
        gnetId: 7639
        revision: 1
        datasource: Prometheus
      istio-service:
        gnetId: 7636
        revision: 1
        datasource: Prometheus
      istio-workload:
        gnetId: 7630
        revision: 1
        datasource: Prometheus